# peblish federation lab: Lemmy 0.19.21, PieFed 1.8.11 and peblish itself (the production
# image), all behind one Caddy TLS front door on an internal network (no route out of the
# lab). Host access is opt-in (`make ports`). See README.md for why each knob exists and
# INTEROP.md for what the lab has shown.
name: feddit-lab

x-lab-ca: &lab-ca /lab-ca/root.crt

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

# One lab secret, shared by the web process and the runner: it keys sessions and encrypts
# two-factor secrets, and the runner seeds two-factor through core.
x-peblish-env: &peblish-env
  DATABASE_URL: postgres://peblish:peblish@peblish-db:5432/peblish
  PUBLIC_ORIGIN: https://peblish.lab.test
  BETTER_AUTH_SECRET: lab-only-better-auth-secret-0123456789abcdef
  NODE_EXTRA_CA_CERTS: *lab-ca

networks:
  # Used only by `host-ports` (profile `host`, started by `make ports`): Docker
  # publishes ports only from non-internal networks. Without it, every running
  # container is on `lab` alone.
  edge: {}
  # Every service lives here. `internal: true` gives it no route out of the lab.
  # 44.255.99.0/24 is ordinary public space (AMPRNet), not a special-purpose range:
  # peblish's safeFetch has no private-address switch and refuses every range in
  # `isPublicAddress`, Lemmy and PieFed keep their SSRF guards on, and nothing here
  # can reach the real owner of the block because the network is internal.
  lab:
    internal: true
    ipam:
      config:
        - subnet: 44.255.99.0/24

volumes:
  caddy-data: {}
  # Holds only Caddy's root certificate, world-readable, for the peers' trust stores.
  lab-ca: {}
  caddy-config: {}
  lemmy-db: {}
  lemmy-pictrs: {}
  piefed-db: {}
  piefed-redis: {}
  peblish-db: {}
  mbin-db: {}
  mbin-oauth: {}
  mbin-media: {}

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      lab:
        aliases:
          - lemmy.lab.test
          - piefed.lab.test
          - mbin.lab.test
          - peblish.lab.test
          - rogue.lab.test
    healthcheck:
      test: ["CMD", "test", "-f", "/data/caddy/pki/authorities/local/root.crt"]
      interval: 2s
      timeout: 2s
      retries: 30
    logging: *logging

  # Copies Caddy's root certificate (not its keys) into the lab-ca volume.
  # Caddy's pki directory is 0700, and Lemmy and PieFed run as non-root users.
  lab-ca:
    image: caddy:2.10-alpine
    volumes:
      - caddy-data:/data:ro
      - lab-ca:/lab-ca
    command: ["sh", "-c", "cp /data/caddy/pki/authorities/local/root.crt /lab-ca/root.crt && chmod 644 /lab-ca/root.crt"]
    network_mode: none
    depends_on:
      caddy:
        condition: service_healthy
    logging: *logging

  # ---------------------------------------------------------------- Lemmy
  lemmy-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lemmy
      POSTGRES_PASSWORD: lemmy
      POSTGRES_DB: lemmy
    volumes:
      - lemmy-db:/var/lib/postgresql/data
    networks: [lab]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lemmy"]
      interval: 2s
      timeout: 2s
      retries: 30
    logging: *logging

  lemmy-pictrs:
    image: asonix/pictrs:0.5.16
    restart: unless-stopped
    user: "991:991"
    environment:
      PICTRS__API_KEY: lab-pictrs-key
      RUST_LOG: warn
    volumes:
      - lemmy-pictrs:/mnt
    networks: [lab]
    logging: *logging

  lemmy:
    image: dessalines/lemmy:0.19.21
    restart: unless-stopped
    environment:
      RUST_LOG: "warn,lemmy_server=info,lemmy_apub=debug,lemmy_federate=info,activitypub_federation=debug"
      # Lab-only: shortens the outbound queue recheck from 30-60 s to about 1 s.
      # It changes timing, not the wire format.
      LEMMY_TEST_FAST_FEDERATION: "1"
      # rustls-native-certs honours SSL_CERT_FILE; the bundle holds only the lab CA.
      SSL_CERT_FILE: *lab-ca
    volumes:
      - ./lemmy/lemmy.hjson:/config/config.hjson:ro
      - lab-ca:/lab-ca:ro
    networks: [lab]
    depends_on:
      lemmy-db:
        condition: service_healthy
      lab-ca:
        condition: service_completed_successfully
      lemmy-pictrs:
        condition: service_started
    logging: *logging

  lemmy-ui:
    image: dessalines/lemmy-ui:0.19.21
    restart: unless-stopped
    init: true
    environment:
      LEMMY_UI_LEMMY_INTERNAL_HOST: lemmy:8536
      # The browser-facing API host is the plain-HTTP convenience port.
      LEMMY_UI_LEMMY_EXTERNAL_HOST: localhost:18201
      LEMMY_UI_HTTPS: "false"
    networks: [lab]
    depends_on: [lemmy]
    logging: *logging

  # ---------------------------------------------------------------- PieFed
  piefed-db:
    image: postgres:17
    restart: unless-stopped
    env_file: ./piefed/piefed.env
    volumes:
      - piefed-db:/var/lib/postgresql/data
    networks: [lab]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U piefed"]
      interval: 2s
      timeout: 2s
      retries: 30
    logging: *logging

  piefed-redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - piefed-redis:/data
    networks: [lab]
    logging: *logging

  piefed-web:
    # No official PieFed image is published; this builds the upstream
    # Dockerfile at the v1.8.11 tag.
    build:
      context: https://codeberg.org/rimu/pyfedi.git#v1.8.11
      target: runtime
    image: feddit-lab/piefed:1.8.11
    restart: unless-stopped
    env_file: ./piefed/piefed.env
    environment:
      # httpx 0.28 (federation client) honours SSL_CERT_FILE; requests honours REQUESTS_CA_BUNDLE.
      SSL_CERT_FILE: *lab-ca
      REQUESTS_CA_BUNDLE: *lab-ca
    entrypoint: ["/usr/bin/tini", "--", "bash", "/lab/entrypoint.sh"]
    volumes:
      - ./piefed/entrypoint.sh:/lab/entrypoint.sh:ro
      - ./piefed/bootstrap.py:/lab/bootstrap.py:ro
      - lab-ca:/lab-ca:ro
    networks: [lab]
    depends_on:
      piefed-db:
        condition: service_healthy
      piefed-redis:
        condition: service_started
      lab-ca:
        condition: service_completed_successfully
    logging: *logging

  piefed-celery:
    image: feddit-lab/piefed:1.8.11
    restart: unless-stopped
    env_file: ./piefed/piefed.env
    environment:
      SSL_CERT_FILE: *lab-ca
      REQUESTS_CA_BUNDLE: *lab-ca
    entrypoint: ./entrypoint_celery.sh
    # The image's HEALTHCHECK curls the web server on :5000, which this worker
    # container does not run, so it always reported unhealthy. Upstream's
    # compose.yaml overrides it with the same Celery ping.
    healthcheck:
      test: ["CMD", "celery", "-A", "celery_worker_docker.celery", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - lab-ca:/lab-ca:ro
    networks: [lab]
    depends_on:
      piefed-web:
        condition: service_started
    logging: *logging

  # ---------------------------------------------------------------- peblish (the production image)
  # Built from the root Dockerfile with no lab switch: the same image deploys to Easypanel.
  peblish-db:
    image: postgres:17.11
    restart: unless-stopped
    environment:
      POSTGRES_USER: peblish
      POSTGRES_PASSWORD: peblish
      POSTGRES_DB: peblish
    volumes:
      - peblish-db:/var/lib/postgresql/data
    networks: [lab]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peblish"]
      interval: 2s
      timeout: 2s
      retries: 30
    logging: *logging

  peblish-migrate:
    build:
      context: ..
    image: peblish:lab
    environment:
      <<: *peblish-env
      PEBLISH_PROCESS: migrate
    networks: [lab]
    restart: "no"
    depends_on:
      peblish-db:
        condition: service_healthy
      lab-ca:
        condition: service_completed_successfully
    volumes:
      - lab-ca:/lab-ca:ro
    logging: *logging

  peblish-web:
    image: peblish:lab
    restart: unless-stopped
    environment:
      <<: *peblish-env
      PEBLISH_PROCESS: web
      # Caddy appends the peer to X-Forwarded-For, as Traefik does on Easypanel, so inbox
      # throttles count peers apart.
      PEBLISH_TRUSTED_PROXY: traefik
    volumes:
      - lab-ca:/lab-ca:ro
    networks: [lab]
    depends_on:
      peblish-migrate:
        condition: service_completed_successfully
    logging: *logging

  # The only process that delivers: the runner starts no consumer or job.
  peblish-worker:
    image: peblish:lab
    restart: unless-stopped
    environment:
      <<: *peblish-env
      PEBLISH_PROCESS: worker
    volumes:
      - lab-ca:/lab-ca:ro
    networks: [lab]
    depends_on:
      peblish-migrate:
        condition: service_completed_successfully
    logging: *logging

  # ---------------------------------------------------------------- Mbin 1.11
  # The smallest set that federates: the web process, one messenger worker on every queue
  # upstream's compose lists, RabbitMQ (no amqproxy), Postgres and Valkey. No Mercure hub,
  # mail, S3 or captcha. The image is amd64-only, so it runs under emulation on Apple silicon.
  mbin-db:
    image: postgres:17.11
    restart: unless-stopped
    environment:
      POSTGRES_USER: mbin
      POSTGRES_PASSWORD: mbin
      POSTGRES_DB: mbin
    volumes:
      - mbin-db:/var/lib/postgresql/data
    networks: [lab]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mbin"]
      interval: 2s
      timeout: 2s
      retries: 30
    logging: *logging

  mbin-valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--requirepass", "mbin"]
    networks: [lab]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a mbin ping | grep -q PONG"]
      interval: 2s
      timeout: 2s
      retries: 30
    logging: *logging

  mbin-rabbitmq:
    image: rabbitmq:3.13-alpine
    restart: unless-stopped
    hostname: mbin-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: mbin
      RABBITMQ_DEFAULT_PASS: mbin
    networks: [lab]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 30
    logging: *logging

  mbin-php:
    image: ghcr.io/mbinorg/mbin:v1.11.0
    platform: linux/amd64
    restart: unless-stopped
    env_file: ./mbin/mbin.env
    entrypoint: ["/lab/entrypoint.sh"]
    command: ["frankenphp", "run", "--config", "/etc/caddy/Caddyfile"]
    volumes:
      - ./mbin/entrypoint.sh:/lab/entrypoint.sh:ro
      - ./mbin/Caddyfile:/etc/caddy/Caddyfile:ro
      - lab-ca:/lab-ca:ro
      - mbin-oauth:/app/config/oauth2
      - mbin-media:/app/public/media
    networks: [lab]
    # The image's HEALTHCHECK curls Caddy's admin metrics, which the lab Caddyfile keeps; the
    # first start runs the migrations, so allow it time.
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:2019/metrics >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    depends_on:
      mbin-db:
        condition: service_healthy
      mbin-valkey:
        condition: service_healthy
      mbin-rabbitmq:
        condition: service_healthy
      lab-ca:
        condition: service_completed_successfully
    logging: *logging

  mbin-messenger:
    image: ghcr.io/mbinorg/mbin:v1.11.0
    platform: linux/amd64
    restart: unless-stopped
    env_file: ./mbin/mbin.env
    entrypoint: ["/lab/entrypoint.sh"]
    command: ["bin/console", "messenger:consume", "scheduler_default", "old", "async", "async_slow", "outbox", "deliver", "inbox", "resolve", "receive", "failed", "--time-limit=3600"]
    # The image's HEALTHCHECK probes Caddy, which this container does not run; upstream's own
    # compose checks that the consumer is running instead.
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep 'messenger[:]consume' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    volumes:
      - ./mbin/entrypoint.sh:/lab/entrypoint.sh:ro
      - lab-ca:/lab-ca:ro
      - mbin-media:/app/public/media
    networks: [lab]
    depends_on:
      mbin-php:
        condition: service_healthy
    logging: *logging

  # ---------------------------------------------------------------- the runner and the rogue
  # Both run tools/interop from one image (runner.Dockerfile). The runner is a one-shot tool
  # container (`make seed`, `make interop`): it calls core against peblish-db the way the web
  # process would, and never delivers or processes the inbox itself.
  rogue:
    build:
      context: ..
      dockerfile: lab/runner.Dockerfile
    image: feddit-lab/interop:dev
    restart: unless-stopped
    environment:
      NODE_EXTRA_CA_CERTS: *lab-ca
    volumes:
      - lab-ca:/lab-ca:ro
    networks: [lab]
    command: ["node", "src/rogue.ts"]
    depends_on:
      lab-ca:
        condition: service_completed_successfully
    logging: *logging

  runner:
    image: feddit-lab/interop:dev
    profiles: [tools]
    environment:
      <<: *peblish-env
      # The runner reads peblish's database directly; the web and worker processes own the rest.
      INTEROP_RESULTS_DIR: /results
    volumes:
      - lab-ca:/lab-ca:ro
      - ./data/results:/results
    networks: [lab]
    depends_on: [peblish-web]
    logging: *logging

  # Opt-in host access (`make ports`): plain TCP from 127.0.0.1 ports to Caddy.
  # The only container on a network with a route out; it connects to Caddy
  # and nothing else (lab/forward.mjs).
  host-ports:
    image: node:24.21.0-bookworm-slim
    profiles: [host]
    restart: unless-stopped
    volumes:
      - ./forward.mjs:/lab/forward.mjs:ro
    command: ["node", "/lab/forward.mjs"]
    ports:
      - "127.0.0.1:18243:8443"
      - "127.0.0.1:18201:8201"
      - "127.0.0.1:18202:8202"
      - "127.0.0.1:18204:8204"
      - "127.0.0.1:18322:8322"
    networks: [edge, lab]
    depends_on: [caddy]
    logging: *logging
