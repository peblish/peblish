name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check, e2e, bundle report
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: peblish
          POSTGRES_PASSWORD: peblish
          POSTGRES_DB: peblish
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U peblish -d peblish"
          --health-interval 2s
          --health-retries 30
    env:
      # Tests recreate the _test database from the migrations; DATABASE_URL is the fresh
      # database the service starts with, migrated below.
      TEST_DATABASE_URL: postgres://peblish:peblish@127.0.0.1:5432/peblish_ci_test
      DATABASE_URL: postgres://peblish:peblish@127.0.0.1:5432/peblish
      PUBLIC_ORIGIN: https://ci.peblish.test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm check (build, typecheck, lint with boundaries, tests on Postgres 17)
        run: pnpm check
      - name: No drift between the tables and the migrations
        run: pnpm db:drift
      - name: Migrations apply to a fresh database
        run: pnpm db:migrate
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright (hydration marker in en-US and de-DE, axe)
        run: pnpm e2e
      - name: Bundle size report (report only)
        run: node scripts/bundle-report.ts >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-artifacts
          path: e2e/artifacts
          retention-days: 7

  image:
    name: image builds and boots to /healthz
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t peblish:ci .
      - name: web answers /healthz
        run: |
          docker run -d --name web -p 127.0.0.1:3000:3000 -e DATABASE_URL=postgres://unused@127.0.0.1/unused peblish:ci
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/healthz && exit 0; sleep 1; done
          docker logs web
          exit 1

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: sh scripts/check-dco.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
