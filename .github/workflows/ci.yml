name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a branch cancels its superseded run; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: check, e2e, bundle report
    runs-on: ubuntu-24.04
    # About 20 minutes on a typical runner; a slow one took over 30 (PR #6), so leave headroom.
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17.11@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env:
          POSTGRES_USER: peblish
          POSTGRES_PASSWORD: peblish
          POSTGRES_DB: peblish
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U peblish -d peblish"
          --health-interval 2s
          --health-retries 30
      # The auth e2e flows read verification and reset mail from Mailpit's API on 18426, as locally.
      mailpit:
        image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
        ports: ['18425:1025', '18426:8025']
    env:
      # Tests recreate the _test database from the migrations; DATABASE_URL is the fresh
      # database the service starts with, migrated below.
      TEST_DATABASE_URL: postgres://peblish:peblish@127.0.0.1:5432/peblish_ci_test
      DATABASE_URL: postgres://peblish:peblish@127.0.0.1:5432/peblish
      PUBLIC_ORIGIN: https://ci.peblish.test
      SMTP_URL: smtp://127.0.0.1:18425
      # The UI lane's component gallery at /kit answers 404 without it; Playwright's
      # webServer.env is merged over this environment, so the e2e server sees it too.
      PEBLISH_UI_KIT: '1'
      # The S3 adapter's tests run against the MinIO started below; the bucket is created by the test.
      S3_ENDPOINT: http://127.0.0.1:18490
      S3_BUCKET: peblish-ci
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: peblish
      S3_SECRET_ACCESS_KEY: peblish-dev-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # compose.yaml's MinIO, same image. Job services cannot take a command, so it is started here.
      - name: Object store (MinIO) for the S3 adapter tests
        run: |
          docker run -d --name minio -p 18490:9000 -e MINIO_ROOT_USER=peblish -e MINIO_ROOT_PASSWORD=peblish-dev-secret \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372 server /data
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:18490/minio/health/live && break; sleep 1; done
      # The cutover drill test (tools/cutover/src/drill.test.ts) skips unless pg_dump and
      # pg_restore --version report the server's major version; ubuntu-24.04 ships 16. PGDG's
      # client 17 goes first on PATH, ahead of pg_wrapper, which could pick the runner's 16.
      - name: Postgres 17 client tools (PGDG) for the backup and restore drill
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" |
            sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version
      - name: pnpm check (build, typecheck, lint with boundaries, tests on Postgres 17)
        run: pnpm check
      - name: No drift between the tables and the migrations
        run: pnpm db:drift
      - name: Migrations apply to a fresh database
        run: pnpm db:migrate
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright (hydration marker in en-US and de-DE, axe, payload budget)
        run: pnpm e2e
        env:
          # Uploads scan against the local hash list only (e2e/playwright.config.ts sets it too).
          MEDIASCAN_LOCAL_ONLY: '1'
      - name: Bundle size summary (the budget itself is enforced by the Playwright step)
        run: node scripts/bundle-report.ts >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-artifacts
          path: e2e/artifacts
          retention-days: 7

  image:
    name: image migrates, runs the worker and serves web
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env:
          POSTGRES_USER: peblish
          POSTGRES_PASSWORD: peblish
          POSTGRES_DB: peblish
        options: >-
          --health-cmd "pg_isready -U peblish -d peblish"
          --health-interval 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t peblish:ci .
      - name: migrate, worker start and SIGTERM, web /healthz and /readyz as non-root
        run: sh scripts/image-smoke.sh peblish:ci "${{ job.services.postgres.network }}" postgres://peblish:peblish@postgres:5432/peblish

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: sh scripts/check-dco.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
